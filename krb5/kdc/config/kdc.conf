[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    PROJECT.TEST = {
        database_name = /var/lib/krb5kdc/principal
        admin_keytab = /var/lib/krb5kdc/kadm5.keytab
        acl_file = /etc/krb5kdc/kadm5.acl
        key_stash_file = /var/lib/krb5kdc/stash

        max_life = 10h
        max_renewable_life = 7d
    }
