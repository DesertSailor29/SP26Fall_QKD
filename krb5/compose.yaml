# Kerberos-authenticated BB84: a KDC, Bob (BB84 receiver with a keytab) and Alice (BB84 sender).
#
#   ./setup.sh                                     first time: principals, keytab, test run
#   docker compose exec alice kinit alice          Alice gets a ticket (valid ~10 h)
#   docker compose exec alice python3 -m qkdsim.node alice \
#       --kerberos bob/localhost@PROJECT.TEST --bob bob:5000 --quantum bob:5001
#   docker compose logs bob                        Bob's side of the run
#
# The BB84 code is mounted from ../src/qkdsim, so edits there need no rebuild.

services:
  kdc:
    build:
      context: ./kdc

    container_name: kdc
    hostname: kdc

    environment:
      KRB5_REALM: PROJECT.TEST
      KDC_MASTER_PASSWORD: ${KDC_MASTER_PASSWORD:?Set KDC_MASTER_PASSWORD in .env}

    ports:
      - "88:88/tcp"
      - "88:88/udp"

    volumes:
      - ./kdc/config/krb5.conf:/etc/krb5.conf:ro
      - ./kdc/config/kdc.conf:/etc/krb5kdc/kdc.conf:ro
      - ./kdc/config/kadm5.acl:/etc/krb5kdc/kadm5.acl:ro
      - ./kdc/data:/var/lib/krb5kdc
      - ./kdc/logs:/var/log/kerberos

    restart: unless-stopped

    networks:
      - kerberos-network

  bob:
    build:
      context: ./bob

    container_name: bob
    hostname: bob

    environment:
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KTNAME: FILE:/etc/bob/bob.keytab

    volumes:
      - ./bob/krb5.conf:/etc/krb5.conf:ro
      - ./bob/keytabs/bob.keytab:/etc/bob/bob.keytab:ro
      - ../src/qkdsim:/app/qkdsim:ro

    # Bob runs one BB84 session (classical :5000, quantum :5001) and exits; the restart policy
    # brings him back for the next one. The Kerberos-only demo is still in src/server.py.
    command: ["python3", "-m", "qkdsim.node", "bob",
              "--kerberos", "bob/localhost@PROJECT.TEST",
              "--kerberos-peer", "alice@PROJECT.TEST"]
    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      - kdc

    networks:
      - kerberos-network

  alice:
    build:
      context: ./alice
    container_name: alice
    hostname: alice
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      KRB5CCNAME: FILE:/tmp/krb5cc_alice
    volumes:
      - ./bob/krb5.conf:/etc/krb5.conf:ro
      - ../src/qkdsim:/app/qkdsim:ro
    depends_on:
      - kdc
    networks:
      - kerberos-network

networks:
  kerberos-network:
    driver: bridge
