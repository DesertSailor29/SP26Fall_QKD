[libdefaults]
    default_realm = PROJECT.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    forwardable = true
    udp_preference_limit = 1

[realms]
    PROJECT.TEST = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .project.test = PROJECT.TEST
    project.test = PROJECT.TEST
